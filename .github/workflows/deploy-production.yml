name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build catalog
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Explicit ASCII commit message — Cloudflare's deployments API rejects
          # non-ASCII (em-dashes, middle-dots, curly quotes) with code 8000111.
          # Without --commit-message, wrangler reads HEAD's raw commit message,
          # which we cannot guarantee is ASCII-clean.
          command: pages deploy catalog --project-name=skills-2nth-ai --branch=main --commit-dirty=true --commit-message="Auto-deploy main ${{ github.sha }}"
